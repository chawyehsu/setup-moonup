name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        moonbit-version: ['latest', 'nightly']
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Moonup
        uses: ./
        with:
          moonbit-version: ${{ matrix.moonbit-version }}

      - name: Verify installation
        run: |
          moonup --version
          moon version
